name: بسته افزونه لحن من

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: ساخت و اعتبارسنجی افزونه
        run: python scripts/build_plugin.py
      - name: ذخیره بسته ساخته‌شده
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lahne-man-plugin
          path: dist/lahne-man-plugin-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: دریافت بسته معتبر
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lahne-man-plugin
          path: dist
      - name: افزودن بسته به Release گیت‌هاب
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/lahne-man-plugin-*.zip --generate-notes --verify-tag
